services:
  netops-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-bughunter-netops-portal
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - PATCH_SQLI=${PATCH_SQLI:-0}
      - PATCH_XSS=${PATCH_XSS:-0}
      - PATCH_IDOR=${PATCH_IDOR:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
