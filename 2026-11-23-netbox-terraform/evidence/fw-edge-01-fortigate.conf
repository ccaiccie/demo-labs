# Standardized FortiGate CLI Configuration
# Generated by Terraform from NetBox Source of Truth
# Device: fw-edge-01 | Site: Branch-West-DC1

config system global
    set hostname "fw-edge-01"
end

# --- Interface Settings (from NetBox Interfaces & IP Addresses) ---
config system interface
    edit "eth-lan"
        set ip 198.51.100.1/24
        set alias "LAN-VLAN10"
        set description "LAN gateway (CORP-USERS / VLAN 10)"
        set allowaccess ping https ssh
    next
    edit "eth-dmz"
        set ip 203.0.113.1/24
        set alias "DMZ-VLAN20"
        set description "DMZ gateway (DMZ-WEB / VLAN 20)"
        set allowaccess ping https ssh
    next
    edit "eth-mgmt"
        set ip 192.0.2.1/24
        set alias "MGMT-VLAN99"
        set description "MGMT gateway (MGMT-OOB / VLAN 99)"
        set allowaccess ping https ssh
    next
end

# --- Firewall Address Objects (from NetBox Prefixes) ---
config firewall address
    edit "NET_CORP_USERS"
        set subnet 198.51.100.0/24
        set comment "NetBox VLAN 10 (CORP-USERS)"
    next
    edit "NET_DMZ_WEB"
        set subnet 203.0.113.0/24
        set comment "NetBox VLAN 20 (DMZ-WEB)"
    next
    edit "NET_MGMT_OOB"
        set subnet 192.0.2.0/24
        set comment "NetBox VLAN 99 (MGMT-OOB)"
    next
end

# --- Standardized Firewall Policies ---
config firewall policy
    edit 10
        set name "allow-corp-to-dmz-https"
        set srcintf "eth-lan"
        set dstintf "eth-dmz"
        set srcaddr "NET_CORP_USERS"
        set dstaddr "NET_DMZ_WEB"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set comments "Allow corporate users HTTPS access to DMZ web servers"
    next
    edit 20
        set name "allow-corp-to-dmz-dns"
        set srcintf "eth-lan"
        set dstintf "eth-dmz"
        set srcaddr "NET_CORP_USERS"
        set dstaddr "NET_DMZ_WEB"
        set action accept
        set schedule "always"
        set service "DNS"
        set logtraffic all
        set comments "Allow corporate users DNS queries to DMZ resolvers"
    next
    edit 30
        set name "allow-mgmt-to-dmz-ssh"
        set srcintf "eth-mgmt"
        set dstintf "eth-dmz"
        set srcaddr "NET_MGMT_OOB"
        set dstaddr "NET_DMZ_WEB"
        set action accept
        set schedule "always"
        set service "SSH"
        set logtraffic all
        set comments "Allow management subnet SSH administration to DMZ hosts"
    next
    edit 40
        set name "deny-dmz-to-corp-all"
        set srcintf "eth-dmz"
        set dstintf "eth-lan"
        set srcaddr "NET_DMZ_WEB"
        set dstaddr "NET_CORP_USERS"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Explicitly block DMZ hosts from initiating traffic to corporate LAN"
    next
end
