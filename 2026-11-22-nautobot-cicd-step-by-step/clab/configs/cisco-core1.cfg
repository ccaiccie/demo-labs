! Cisco IOS-XE (CSR1000v 17.03.08a) baseline config for cisco-core1
hostname cisco-core1
ip domain name lab.internal
!
ntp server 192.0.2.123
logging host 192.0.2.200
snmp-server community lab-ro-demo RO
!
enable secret LabDemo123!
username admin privilege 15 secret LabDemo123!
!
ip ssh version 2
ip scp server enable
!
interface Loopback0
 description Router ID and Management Loopback
 ip address 192.0.2.13 255.255.255.255
!
interface GigabitEthernet1
 description OOB Management (vrnetlab NAT)
 ip address 10.0.0.15 255.255.255.0
 no shutdown
!
interface GigabitEthernet2
 description Downlink to ceos-leaf1 Eth1
 ip address 198.51.100.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet3
 description Downlink to ceos-leaf2 Eth1
 ip address 198.51.100.3 255.255.255.254
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.0.2
!
router bgp 65010
 bgp router-id 192.0.2.13
 bgp log-neighbor-changes
 network 192.0.2.13 mask 255.255.255.255
 neighbor 198.51.100.0 remote-as 65001
 neighbor 198.51.100.0 description ceos-leaf1
 neighbor 198.51.100.2 remote-as 65002
 neighbor 198.51.100.2 description ceos-leaf2
!
line vty 0 4
 login local
 transport input ssh
!
end
