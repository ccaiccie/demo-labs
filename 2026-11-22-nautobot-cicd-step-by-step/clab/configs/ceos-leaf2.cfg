! Arista cEOS baseline startup-config for ceos-leaf2
hostname ceos-leaf2
ip domain-name lab.internal
!
ntp server 192.0.2.123
logging host 192.0.2.200
snmp-server community lab-ro-demo ro
!
enable secret LabDemo123!
username admin privilege 15 role network-admin secret LabDemo123!
!
aaa authorization exec default local
!
vlan 100
   name USERS
!
vlan 200
   name SERVERS
!
interface Ethernet1
   description Uplink to cisco-core1 Gi3
   no switchport
   ip address 198.51.100.2/31
   no shutdown
!
interface Ethernet2
   description Peer link to ceos-leaf1 Eth2
   no switchport
   ip address 198.51.100.5/31
   no shutdown
!
interface Loopback0
   description Router ID and Management Loopback
   ip address 192.0.2.12/32
!
interface Management0
   description OOB Management
   ip address 172.30.30.12/24
   no shutdown
!
ip routing
ip route 0.0.0.0/0 172.30.30.1
!
router bgp 65002
   router-id 192.0.2.12
   neighbor 198.51.100.3 remote-as 65010
   neighbor 198.51.100.3 description cisco-core1
   neighbor 198.51.100.4 remote-as 65001
   neighbor 198.51.100.4 description ceos-leaf1
   network 192.0.2.12/32
!
management api http-commands
   protocol http
   protocol https
   no shutdown
!
management ssh
   no shutdown
!
end
