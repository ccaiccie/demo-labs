server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: suricata-eve
    static_configs:
      - targets:
          - localhost
        labels:
          job: suricata
          __path__: /var/log/suricata/eve.json
    pipeline_stages:
      - json:
          expressions:
            event_type: event_type
            alert: alert
            src_ip: src_ip
            dest_ip: dest_ip
            timestamp: timestamp
      - labels:
          event_type:
      - match:
          selector: '{job="suricata"}'
          stages:
            - json:
                expressions:
                  signature: alert.signature
                  category: alert.category
                  severity: alert.severity
                  signature_id: alert.signature_id
            - labels:
                signature:
                category:
                severity:
