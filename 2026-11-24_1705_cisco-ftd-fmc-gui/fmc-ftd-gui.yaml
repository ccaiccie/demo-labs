    configuration:
      - name: ios_config.txt
        content: |-
          ! ISP - simulated Internet provider: the FTD outside interfaces sit on 198.51.100.0/24
          hostname ISP
          no ip domain lookup
          interface Ethernet0/0
           description Internet (CML NAT connector)
           ip address dhcp
           ip nat outside
           no shutdown
          interface Ethernet0/1
           description OUTSIDE segment 198.51.100.0/24
           ip address 198.51.100.1 255.255.255.0
           ip nat inside
           no shutdown
          ip access-list standard OUTSIDE-NET
           permit 198.51.100.0 0.0.0.255
          ip nat inside source list OUTSIDE-NET interface Ethernet0/0 overload
          end
    cpu_limit: null
