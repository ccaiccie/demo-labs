services:
  netops-status:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netops-status
    ports:
      - "127.0.0.1:8099:8099"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
