hostname edge-rtr1
!
interface GigabitEthernet0/0
 description WAN to ISP-A
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN core
 ip address 10.20.0.1 255.255.255.0
!
interface GigabitEthernet0/2
 description TEMP vendor access
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
router bgp 65010
 neighbor 198.51.100.2 remote-as 64500
 neighbor 198.51.100.2 password 7 0822455D0A16
 network 10.20.0.0 mask 255.255.255.0
!
ip access-list extended MGMT
 permit tcp any any eq 22
 deny ip any any log
!
snmp-server community public RW
logging host 10.20.0.50
ntp server 10.20.0.10
line vty 0 4
 transport input telnet ssh
!
end
