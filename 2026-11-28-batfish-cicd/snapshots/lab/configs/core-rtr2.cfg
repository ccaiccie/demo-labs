version 15.2
!
hostname core-rtr2
!
interface Loopback0
 ip address 198.51.100.3 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to core-rtr1
 ip address 10.10.23.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Link to edge-rtr
 ip address 10.10.34.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 198.51.100.3
 network 198.51.100.3 0.0.0.0 area 0
 network 10.10.23.0 0.0.0.3 area 0
!
router bgp 65200
 bgp router-id 198.51.100.3
 neighbor 198.51.100.2 remote-as 65200
 neighbor 198.51.100.2 update-source Loopback0
 neighbor 198.51.100.2 next-hop-self
 neighbor 10.10.34.2 remote-as 65300
!
end
