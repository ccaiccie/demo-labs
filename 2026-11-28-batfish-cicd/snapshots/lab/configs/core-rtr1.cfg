version 15.2
!
hostname core-rtr1
!
interface Loopback0
 ip address 198.51.100.2 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to branch-rtr
 ip address 10.10.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Link to core-rtr2
 ip address 10.10.23.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 198.51.100.2
 network 198.51.100.2 0.0.0.0 area 0
 network 10.10.23.0 0.0.0.3 area 0
!
router bgp 65200
 bgp router-id 198.51.100.2
 neighbor 10.10.12.1 remote-as 65100
 neighbor 198.51.100.3 remote-as 65200
 neighbor 198.51.100.3 update-source Loopback0
 neighbor 198.51.100.3 next-hop-self
!
end
