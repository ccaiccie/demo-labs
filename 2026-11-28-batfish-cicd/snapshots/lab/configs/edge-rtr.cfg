version 15.2
!
hostname edge-rtr
!
interface Loopback0
 ip address 198.51.100.4 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to core-rtr2
 ip address 10.10.34.2 255.255.255.252
 ip access-group EDGE_IN in
 no shutdown
!
interface GigabitEthernet0/1
 description Server LAN
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
router bgp 65300
 bgp router-id 198.51.100.4
 neighbor 10.10.34.1 remote-as 65200
 network 203.0.113.0 mask 255.255.255.0
 network 198.51.100.4 mask 255.255.255.255
!
ip access-list extended EDGE_IN
 permit tcp 10.10.34.0 0.0.0.3 10.10.34.0 0.0.0.3 eq 179
 permit tcp 10.10.34.0 0.0.0.3 eq 179 10.10.34.0 0.0.0.3
 permit tcp 192.0.2.0 0.0.0.255 203.0.113.0 0.0.0.255 eq 443
 permit icmp 192.0.2.0 0.0.0.255 203.0.113.0 0.0.0.255
 deny tcp 192.0.2.0 0.0.0.255 203.0.113.0 0.0.0.255 eq 23
 permit tcp 192.0.2.0 0.0.0.255 203.0.113.0 0.0.0.255 eq 8443
 deny ip any any
!
end
