services:
  incidentbot:
    build: .
    ports:
      - "127.0.0.1:5515:5515/udp"
      - "127.0.0.1:8097:8097"
    volumes:
      - incidentbot_data:/data
    environment:
      INCIDENTBOT_DB_PATH: /data/incidentbot.db
      INCIDENTBOT_SYSLOG_HOST: 0.0.0.0
      INCIDENTBOT_SYSLOG_PORT: "5515"
      INCIDENTBOT_HTTP_HOST: 0.0.0.0
      INCIDENTBOT_HTTP_PORT: "8097"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  incidentbot_data:
