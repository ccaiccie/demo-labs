# Only the disposable staff source and lab origin, never a general proxy policy.
acl branch_lab_staff src 192.168.1.11/32
acl branch_lab_portal dstdomain portal.branch.test
acl branch_lab_tls port 443
acl branch_lab_connect method CONNECT
acl branch_lab_docs urlpath_regex ^/docs([?]|$)
acl branch_lab_uploads urlpath_regex ^/uploads([?]|$)
# The tunnel request has no URL path. The decrypted request below does.
http_access allow branch_lab_staff branch_lab_portal branch_lab_tls branch_lab_connect
http_access allow branch_lab_staff branch_lab_portal branch_lab_tls branch_lab_docs
deny_info ERR_ACCESS_DENIED branch_lab_uploads
http_access deny branch_lab_staff branch_lab_portal branch_lab_tls branch_lab_uploads
http_access deny branch_lab_staff branch_lab_portal branch_lab_tls
