lab:
  description: ISE 3.5 authenticates a wired 802.1X computer and a Linux device via
    MAB through two IOSvL2 switches; FTDv (locally managed) provides static NAT port-forwards
    and user authentication for internet egress.
  notes: ''
  title: ISE 802.1X and MAB with FTD Internet Egress
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
