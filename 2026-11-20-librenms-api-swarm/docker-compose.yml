name: librenms-api

x-snmp-agent: &snmp-agent
  image: librenms-api-snmpd:local
  build:
    context: ./configs/snmpd
    dockerfile: Dockerfile
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "snmpget -v2c -c ${LAB_SNMP_COMMUNITY:-lab-ro-community} -t 2 -r 1 127.0.0.1 1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 || exit 1"
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  db:
    image: mariadb:10.11
    container_name: librenms-api-db
    restart: unless-stopped
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-librenms}
      MYSQL_USER: ${MYSQL_USER:-librenms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab-local-db-pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab-local-root-pass}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - lab_mgmt
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: librenms-api-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis_data:/data
    networks:
      - lab_mgmt
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  librenms:
    image: librenms/librenms:latest
    container_name: librenms-api-web
    hostname: librenms
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "127.0.0.1:8012:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-lab-local-db-pass}
      DB_TIMEOUT: "60"
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      APP_URL: ${LIBRENMS_APP_URL:-http://127.0.0.1:8012}
      LIBRENMS_SNMP_DISABLE: "false"
    volumes:
      - librenms_data:/data
    networks:
      lab_mgmt: {}
      lab_core:
        ipv4_address: 192.0.2.2
      lab_branch:
        ipv4_address: 198.51.100.2
      lab_edge:
        ipv4_address: 203.0.113.2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS -I http://127.0.0.1:8000/ | grep -qE 'HTTP/[0-9.]+ (200|302)'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  dispatcher:
    image: librenms/librenms:latest
    container_name: librenms-api-dispatcher
    hostname: librenms-dispatcher
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      librenms:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-librenms}
      DB_USER: ${MYSQL_USER:-librenms}
      DB_PASSWORD: ${MYSQL_PASSWORD:-lab-local-db-pass}
      DB_TIMEOUT: "60"
      REDIS_HOST: redis
      SIDECAR_DISPATCHER: "1"
      DISPATCHER_NODE_ID: dispatcher-lab-01
    volumes:
      - librenms_data:/data
    networks:
      lab_mgmt: {}
      lab_core:
        ipv4_address: 192.0.2.3
      lab_branch:
        ipv4_address: 198.51.100.3
      lab_edge:
        ipv4_address: 203.0.113.3
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f librenms-service.py >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  webhook-receiver:
    image: python:3.12-alpine
    container_name: librenms-api-webhook
    hostname: webhook-receiver
    restart: unless-stopped
    command: ["python3", "/app/server.py"]
    environment:
      TZ: ${TZ:-UTC}
      WEBHOOK_PORT: "8080"
      ALERT_LOG_PATH: /tmp/alerts.jsonl
    volumes:
      - ./configs/webhook/server.py:/app/server.py:ro
    networks:
      - lab_mgmt
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  core-rtr-01:
    <<: *snmp-agent
    container_name: librenms-api-core-rtr-01
    hostname: core-rtr-01.lab.internal
    volumes:
      - ./configs/snmpd/core-rtr-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_core:
        ipv4_address: 192.0.2.11
        aliases:
          - core-rtr-01.lab.internal

  core-sw-01:
    <<: *snmp-agent
    container_name: librenms-api-core-sw-01
    hostname: core-sw-01.lab.internal
    volumes:
      - ./configs/snmpd/core-sw-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_core:
        ipv4_address: 192.0.2.12
        aliases:
          - core-sw-01.lab.internal

  br-rtr-01:
    <<: *snmp-agent
    container_name: librenms-api-br-rtr-01
    hostname: br-rtr-01.lab.internal
    volumes:
      - ./configs/snmpd/br-rtr-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_branch:
        ipv4_address: 198.51.100.11
        aliases:
          - br-rtr-01.lab.internal

  br-sw-01:
    <<: *snmp-agent
    container_name: librenms-api-br-sw-01
    hostname: br-sw-01.lab.internal
    volumes:
      - ./configs/snmpd/br-sw-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_branch:
        ipv4_address: 198.51.100.12
        aliases:
          - br-sw-01.lab.internal

  edge-fw-01:
    <<: *snmp-agent
    container_name: librenms-api-edge-fw-01
    hostname: edge-fw-01.lab.internal
    volumes:
      - ./configs/snmpd/edge-fw-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_edge:
        ipv4_address: 203.0.113.11
        aliases:
          - edge-fw-01.lab.internal

  edge-ap-01:
    <<: *snmp-agent
    container_name: librenms-api-edge-ap-01
    hostname: edge-ap-01.lab.internal
    volumes:
      - ./configs/snmpd/edge-ap-01.conf:/etc/snmp/snmpd.conf:ro
    networks:
      lab_edge:
        ipv4_address: 203.0.113.12
        aliases:
          - edge-ap-01.lab.internal

networks:
  lab_mgmt:
    driver: bridge
  lab_core:
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24
  lab_branch:
    driver: bridge
    ipam:
      config:
        - subnet: 198.51.100.0/24
  lab_edge:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24

volumes:
  db_data:
  redis_data:
  librenms_data:
